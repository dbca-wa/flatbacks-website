; php-fpm's own log level. Upstream (php-fpm.d/docker.conf) leaves it at the
; default "notice", which writes pool lifecycle chatter to stderr: "fpm is
; running", "ready to handle connections", "child N started/exited after N
; requests". "warning" keeps warnings, errors and alerts.
;
; Per-request access lines are NOT affected: [www] access.log in docker.conf
; writes through fpm_log_write(), which does not consult log_level.
;
; zz- prefix so it loads after docker.conf / zz-docker.conf. Nothing else sets
; log_level, so there is no override ordering to worry about.
[global]
log_level = warning
