; php-fpm pool tuning for flatbacks-website.
;
; Loaded last (zz-*) so these values override the upstream defaults in www.conf
; (pm = dynamic, pm.max_children = 5, start 2, min spare 1, max spare 3).
;
; Sizing: the php container is limited to 1Gi (kustomize/base/webserver.yml).
; opcache alone reserves 128M (opcache.memory_consumption in
; opcache-recommended.ini) and the master process needs its share, so four
; workers keeps comfortable headroom for typical 60-100M Drupal workers. The
; per-worker memory_limit=512M (php-config.ini) is a worst case, not a target:
; four fully-saturated workers would exceed the pod limit, which is why this is
; deliberately below the upstream default of 5. Check actual usage with
; `docker stats`, or on a FPM host with `ps -o rss` against the worker processes,
; before raising it.
[www]
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Recycle workers after 500 requests to bound memory growth from long-lived
; processes (opcache stays shared, so the cost of recycling is small).
pm.max_requests = 500
