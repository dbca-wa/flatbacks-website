# nginx configuration for the flatbacks-website webserver sidecar.
#
# The image is built from the drupal:*-fpm-* variant, which contains php-fpm but
# no webserver. nginx is installed alongside php-fpm in the same image and runs
# as a second container in the pod, sharing the network namespace so it can
# reach php-fpm on 127.0.0.1:9000 and serve the same docroot directly.
#
# The container runs as uid 33 (www-data) with a read-only root filesystem, so
# everything nginx writes at runtime lives under /tmp (a pod emptyDir), and logs
# go to the container's stdout/stderr. The package's /var/lib/nginx was removed
# at build time, so every *_temp_path below must stay configured.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    proxy_temp_path /tmp/proxy_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Drupal media uploads: nginx defaults to 1m, whereas Apache placed no
    # comparable limit in front of PHP (upload_max_filesize remains the real cap).
    client_max_body_size 64m;

    keepalive_timeout 65;
    types_hash_max_size 2048;

    server {
        listen 8080;
        server_name _;

        # /var/www/html is a symlink to /opt/drupal/web in the base image.
        root /opt/drupal/web;
        index index.php;
        charset utf-8;

        # Pod probe endpoint; never routed by the ingress.
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        # php-fpm health check (ping.path in zz-health.conf). Used as the pod's
        # readiness probe so traffic only arrives once both containers serve.
        location = /fpm-ping {
            access_log off;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /fpm-ping;
            fastcgi_pass 127.0.0.1:9000;
        }

        # The rules below mirror Drupal core's shipped web/.htaccess deny list.
        # Apache is no longer in front of the docroot, so without these the
        # matched files would be served as plain text.
        location ~* \.(engine|inc|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml)(~|\.sw[op]|\.bak|\.orig|\.save)?$ {
            deny all;
        }
        location ~ "/(Entries.*|Repository|Root|Tag|Template|composer\.(json|lock)|web\.config|yarn\.lock|package(-lock)?\.json)$" {
            deny all;
        }
        location ~ "^/.*#.*#$" {
            deny all;
        }
        location ~ \.php(~|\.sw[op]|\.bak|\.orig|\.save)$ {
            deny all;
        }
        # Dotfiles, but allow ACME challenges.
        location ~ /\.(?!well-known/) {
            deny all;
        }
        # Never execute PHP from the public files directory.
        location ~ ^/sites/[^/]+/files/.*\.php$ {
            deny all;
        }
        # Private files and the config sync directory are configured inside the
        # public files path (settings.php); keep them unreachable over HTTP.
        location ~ ^/sites/[^/]+/files/(private|config_[^/]+)/ {
            deny all;
        }

        # Drupal core sets a two week expiry via mod_expires.
        location ~* \.(css|js|jpe?g|gif|png|svg|ico|webp|avif|woff2?|ttf|eot|map|pdf)$ {
            expires 14d;
            access_log off;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTP_PROXY "";
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
    }
}
