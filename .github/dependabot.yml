version: 2
updates:
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'drupal/core*'
        update-types: ['version-update:semver-major']
    groups:
      drupal-core:
        patterns:
          - 'drupal/core*'
    commit-message:
      prefix: '[composer] '
    cooldown:
      default-days: 3
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: '[actions] '
    cooldown:
      default-days: 7
  # Base image bumps (see the FROM comment in the Dockerfile: tag-only is
  # deliberate, no digest pins, minor/patch updates only).
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: '[docker] '
    cooldown:
      default-days: 7
