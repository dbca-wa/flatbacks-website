# Builds and pushes the multi-architecture (amd64/arm64) image to GHCR
# using the shared docker-bake.hcl, so local and CI builds are identical.
#
# Each architecture is built on a *native* runner (no QEMU): the amd64 and arm64
# jobs push per-arch staging tags, then the merge job assembles them into the
# final multi-arch manifest with `docker buildx imagetools create`. Building
# arm64 natively instead of emulating it is the biggest single saving on the
# apt/pecl/composer steps, and each job keeps its own GitHub Actions cache
# scope (CACHE_SCOPE in docker-bake.hcl) so they don't share cache entries.
name: Build multi-architecture image

on:
  schedule:
    - cron: '31 21 * * 1-5'
  push:
    branches:
      - main
      - dev
    tags:
      - '*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  meta:
    name: Determine image tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # "latest" when HEAD does not carry a semver tag.
      version: ${{ steps.image_tag.outputs.value }}
      has_version_tag: ${{ steps.image_tag.outputs.has_version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags are needed to detect a version tag
          persist-credentials: false

      - name: Determine image tag
        id: image_tag
        shell: bash
        run: |
          set -euo pipefail
          # Parse any valid semver tag, including optional leading 'v' and prerelease/build metadata.
          tag="$(git tag --points-at HEAD | grep -E '^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' | head -n 1 || true)"
          if [ -n "$tag" ]; then
            # strip a leading 'v' (e.g. v1.2.3-rc.1 -> 1.2.3-rc.1)
            semtag="${tag#v}"
            echo "value=${semtag}" >> "$GITHUB_OUTPUT"
            echo "has_version_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
            echo "has_version_tag=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build linux/${{ matrix.arch }} image
    needs: meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native GitHub-hosted runners, so neither architecture is emulated.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write # push per-arch staging tags to GHCR
      attestations: write # image provenance / SLSA
      id-token: write # OIDC for provenance
    steps:
      - name: Harden the GitHub runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # tags are resolved in the meta job

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push with Docker Buildx
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          # Per-arch cache scope (see docker-bake.hcl target "ci").
          CACHE_SCOPE: flatbacks-${{ matrix.arch }}
        with:
          files: docker-bake.hcl
          targets: ci # CI-only target: gha cache + pull
          push: true
          set: |
            ci.platforms=linux/${{ matrix.arch }}
            ci.tags=${{ env.GHCR_IMAGE }}:latest-${{ matrix.arch }}
            ${{ needs.meta.outputs.has_version_tag == 'true' && format('ci.tags+={0}:{1}-{2}', env.GHCR_IMAGE, needs.meta.outputs.version, matrix.arch) || '' }}

  merge:
    name: Assemble multi-arch manifest
    needs:
      - meta
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # write the final tags to GHCR
    steps:
      - name: Harden the GitHub runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-architecture images
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          HAS_VERSION_TAG: ${{ needs.meta.outputs.has_version_tag }}
        run: |
          set -euo pipefail
          # imagetools create copies each source manifest *and* its attestation
          # referrers, so provenance/SBOM from the per-arch builds are preserved
          # in the merged index.
          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:latest" \
            "${GHCR_IMAGE}:latest-amd64" \
            "${GHCR_IMAGE}:latest-arm64"
          if [ "${HAS_VERSION_TAG}" = "true" ]; then
            docker buildx imagetools create \
              --tag "${GHCR_IMAGE}:${VERSION}" \
              "${GHCR_IMAGE}:${VERSION}-amd64" \
              "${GHCR_IMAGE}:${VERSION}-arm64"
          fi

      - name: Verify published platforms
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          HAS_VERSION_TAG: ${{ needs.meta.outputs.has_version_tag }}
        run: |
          set -euo pipefail
          ref="${GHCR_IMAGE}:latest"
          if [ "${HAS_VERSION_TAG}" = "true" ]; then
            ref="${GHCR_IMAGE}:${VERSION}"
          fi
          # Fail loudly rather than publishing a single-platform "multi-arch"
          # tag. Attestation manifests show up here as unknown/unknown.
          platforms="$(docker buildx imagetools inspect --format \
            '{{range .Manifest.Manifests}}{{if .Platform}}{{.Platform.OS}}/{{.Platform.Architecture}}{{else}}none{{end}} {{end}}' \
            "${ref}")"
          echo "${ref} manifests: ${platforms}"
          for want in linux/amd64 linux/arm64; do
            case " ${platforms} " in
              *" ${want} "*) ;;
              *)
                echo "::error::${ref} is missing ${want}" >&2
                exit 1
                ;;
            esac
          done

  scan:
    name: Docker image vulnerability scan
    runs-on: ubuntu-latest
    continue-on-error: true # If vulnerability scan fails, the workflow can still complete successfully.
    needs:
      - meta
      - merge
    permissions:
      contents: read
      packages: read
      security-events: write
    timeout-minutes: 30
    steps:
      - name: Run Anchore vulnerability scanner
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.GHCR_IMAGE }}:${{ needs.meta.outputs.version }}
          fail-build: false
          output-format: sarif
          severity-cutoff: high
          only-fixed: true
          cache-db: true

      - name: Upload scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
