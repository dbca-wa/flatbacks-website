apiVersion: apps/v1
kind: Deployment
metadata:
  name: flatbacks-webserver
spec:
  template:
    spec:
      containers:
        - name: php
          envFrom:
            - secretRef:
                name: flatbacks-env-uat
          volumeMounts:
            - mountPath: /opt/drupal/web/sites/default/settings.php
              name: flatbacks-configmap
              readOnly: true
              subPath: settings.php
            - mountPath: /usr/local/etc/php/conf.d/php-config.ini
              name: flatbacks-configmap
              readOnly: true
              subPath: php-config.ini
            - mountPath: /opt/drupal/web/sites/default/files
              name: flatbacks-files
        # nginx serves static and aggregated files straight from the shared
        # files volume, so it needs the same mount (read-only).
        - name: nginx
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - mountPath: /opt/drupal/web/sites/default/files
              name: flatbacks-files
              readOnly: true
      volumes:
        - name: flatbacks-configmap
          configMap:
            name: flatbacks-configmap-uat
            defaultMode: 420
            optional: false
        - name: flatbacks-files
          persistentVolumeClaim:
            claimName: pvc-flatbacks-files-blob-uat
      tolerations:
        - key: arch
          operator: Equal
          value: arm64
          effect: NoSchedule
