memory_limit=512M
zend.exception_ignore_args=On
zend.exception_string_param_max_len=0
zend.assertions=-1
error_reporting=E_ALL & ~E_NOTICE & ~E_DEPRECATED
display_errors=Off
display_startup_errors=Off
html_errors=Off
ignore_repeated_errors=On
mysqlnd.collect_statistics=On
mysqlnd.collect_memory_statistics=Off
output_buffering=4096

; apcu and uploadprogress are installed and enabled in the image via
; `docker-php-ext-enable` (see the Dockerfile). Do not add extension= lines for
; them here: PHP then loads each module twice and logs
; "Module ... is already loaded" on every CLI invocation (e.g. drush).
