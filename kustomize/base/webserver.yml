apiVersion: apps/v1
kind: Deployment
metadata:
  name: flatbacks-webserver
  labels:
    app: flatbacks-website
spec:
  selector:
    matchLabels:
      app: flatbacks-website
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: flatbacks-website
    spec:
      containers:
        # php-fpm. Built from the drupal:*-fpm-* base; the image's default CMD
        # (php-fpm) is used as-is. Not exposed by the Service: nginx proxies to
        # it over the pod's loopback interface.
        - name: php
          image: ghcr.io/dbca-wa/flatbacks-website
          imagePullPolicy: Always
          env:
            - name: TZ
              value: 'Australia/Perth'
          ports:
            - name: fpm
              containerPort: 9000
              protocol: TCP
          resources:
            requests:
              memory: '128Mi'
              cpu: '10m'
            limits:
              memory: '1Gi'
              cpu: '1000m'
          startupProbe:
            exec:
              command:
                - php-fpm
                - -t
            failureThreshold: 3
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - 'exec 3<>/dev/tcp/127.0.0.1/9000'
            failureThreshold: 3
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 33
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: php-tmp
              mountPath: /tmp
        # nginx. Runs from the same image, so its /opt/drupal/web matches the
        # php-fpm container exactly. The Service targets this container.
        - name: nginx
          image: ghcr.io/dbca-wa/flatbacks-website
          imagePullPolicy: Always
          command:
            - nginx
            - -g
            - 'daemon off;'
          env:
            - name: TZ
              value: 'Australia/Perth'
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: '16Mi'
              cpu: '5m'
            limits:
              memory: '64Mi'
              cpu: '200m'
          startupProbe:
            exec:
              command:
                - nginx
                - -t
            failureThreshold: 3
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 3
          # Readiness goes through nginx to php-fpm's ping endpoint, so a dead
          # php-fpm removes the pod from the Service instead of serving 502s.
          readinessProbe:
            httpGet:
              path: /fpm-ping
              port: http
            failureThreshold: 3
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            failureThreshold: 3
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 33
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        # Separate memory-backed scratch space per container: nginx request
        # bodies and php-fpm uploads/sessions should not share a memory budget.
        - name: php-tmp
          emptyDir:
            medium: Memory
        - name: nginx-tmp
          emptyDir:
            medium: Memory
      restartPolicy: Always
      terminationGracePeriodSeconds: 180
      automountServiceAccountToken: false
      tolerations:
        - key: arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      affinity:
        # Set a node affinity to favour ARM64-based nodes (preference only).
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: arch
                    operator: In
                    values:
                      - arm64
          # Pointless/no-op selector to deal with Rancher GUI issue.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: Exists
        # Set a pod anti-affinity to spread workload pods between nodes (preference only).
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: flatbacks-website
                topologyKey: kubernetes.io/hostname
